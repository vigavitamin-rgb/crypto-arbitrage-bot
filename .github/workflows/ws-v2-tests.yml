name: WebSocket V2 offline tests

on:
  push:
    branches: [ws-test-connection]
  workflow_dispatch:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ws_v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m py_compile app.py test_offline.py
      - name: Run offline unit tests
        run: python -m unittest -v test_offline.py
